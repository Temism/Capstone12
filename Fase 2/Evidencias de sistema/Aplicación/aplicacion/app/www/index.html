<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>EduConnect Móvil - Profesor y Apoderado</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            fadeIn: 'fadeIn 0.2s ease-in-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(4px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Custom Mobile Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* Soporte Safe Area en Dispositivos Móviles y Notch */
    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      height: 100vh;
      overflow: hidden;
    }

    .safe-top-padding {
      padding-top: max(env(safe-area-inset-top, 0px), 16px);
    }

    /* Simulación de teléfono si se prueba en navegador de escritorio */
    @media (min-width: 640px) {
      body {
        background-color: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 20px 0;
      }
      .mobile-device-shell {
        width: 412px;
        min-height: 840px;
        max-height: 92vh;
        background: #f8fafc;
        border-radius: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
        overflow-y: auto;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .desktop-helper-bar {
        display: flex !important;
      }
    }

    @media (max-width: 639px) {
      body {
        background-color: #f8fafc;
      }
      .mobile-device-shell {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .desktop-helper-bar {
        display: none !important;
      }
    }

    /* Ocultar barra de desplazamiento */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full bg-slate-100 antialiased font-sans">

  <!-- Barra de Ayuda para Pruebas en Desktop -->
  <div class="desktop-helper-bar hidden max-w-md w-full mb-3 px-4 py-2 rounded-2xl bg-slate-800 text-slate-200 text-xs font-semibold items-center justify-between border border-slate-700 shadow-md">
    <div class="flex items-center gap-2">
      <i data-lucide="smartphone" class="w-4 h-4 text-amber-400"></i>
      <span>App Móvil EduConnect (Profesor y Apoderado)</span>
    </div>
    <span class="text-[10px] text-amber-300 font-bold">APK / Web</span>
  </div>

  <!-- Contenedor Principal de la App Móvil -->
  <div class="mobile-device-shell no-scrollbar" id="mobile-root">
    <!-- Renderizado por js/app.js -->
  </div>

  <!-- Scripts de la Aplicación Móvil -->
  <script src="js/data.js"></script>
  <script src="js/mobile-api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
